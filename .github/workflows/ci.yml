name: Fork Validation (No Deployments)

on:
  push:
    branches:
      - master
      - dev/majora-of-time-deku-prototype
  pull_request:
    branches:
      - dev/majora-of-time-deku-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and TypeScript validation
    runs-on: ubuntu-latest
    container: ghcr.io/ootmm/toolchain:1.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install repository dependencies
        uses: ./.github/actions/setup

      - name: Check latest commit formatting
        run: git show --check --oneline HEAD

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
