name: Fork Validation (No Deployments)

on:
  push:
    branches:
      - master
      - dev/majora-of-time-deku-prototype
  pull_request:
    branches:
      - dev/majora-of-time-deku-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ghcr.io/ootmm/toolchain:1.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install repository dependencies
        uses: ./.github/actions/setup

      - name: Provide CI-only Deku object constants
        shell: bash
        run: |
          mkdir -p packages/generator/build/include
          cat > packages/generator/build/include/custom.h <<'EOF'
          #ifndef CUSTOM_H
          #define CUSTOM_H
          /* Compile-only placeholders. Real IDs are generated from both ROMs outside CI. */
          #define CUSTOM_OBJECT_ID_DEKU_LINK 0x7fff
          #define CUSTOM_OBJECT_DEKU_LINK_0 0
          #endif
          EOF

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
