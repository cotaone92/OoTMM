name: Fork Validation (No Deployments)

on:
  push:
    branches:
      - master
      - dev/majora-of-time-deku-prototype
  pull_request:
    branches:
      - dev/majora-of-time-deku-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ghcr.io/ootmm/toolchain:1.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install repository dependencies
        uses: ./.github/actions/setup

      - name: Provide CI-only Deku object constants
        shell: bash
        run: |
          # The real object ID/offset are generated from the two ROMs.
          # CI has no ROM inputs, so inject compile-only placeholders into this checkout.
          header=packages/generator/include/combo/custom.h
          sed -i '$d' "$header"
          cat >> "$header" <<'EOF'
          #define CUSTOM_OBJECT_ID_DEKU_LINK 0x7fff
          #define CUSTOM_OBJECT_DEKU_LINK_0 0x6000000
          #endif
          EOF

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
