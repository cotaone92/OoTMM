name: Native N64 Payload Build (No ROM)

on:
  push:
    branches:
      - dev/majora-of-time-deku-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-payload:
    name: Compile OoT/MM native payloads
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/ootmm/toolchain:1.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install repository dependencies
        uses: ./.github/actions/setup

      - name: Build native payloads and overlays
        run: pnpm nx run @ootmm/generator:build

      - name: Upload intermediate payload package
        uses: actions/upload-artifact@v6
        with:
          name: ootmm-native-payloads
          path: packages/generator/dist/data.zip
          if-no-files-found: error
          retention-days: 7
